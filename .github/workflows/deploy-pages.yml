# Builds the Angular app (angular-agent-create) and publishes it to GitHub Pages.
# Runs on every push to main. Repo: chezev/AI-Platform-DBX  ->  served at
# https://chezev.github.io/AI-Platform-DBX/
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-agent-create
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # base-href must match the repo name so assets resolve under the sub-path.
      - run: npm run build -- --base-href=/AI-Platform-DBX/
      # SPA fallback so refreshing a deep link doesn't 404.
      - run: cp dist/angular-agent-create/browser/index.html dist/angular-agent-create/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: angular-agent-create/dist/angular-agent-create/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
