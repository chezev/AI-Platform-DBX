<main class="feature-shell" aria-label="Flowbuilder module">
  <a routerLink="/" class="feature-back">Back to home</a>

  <section class="feature-card">
    <p class="feature-eyebrow">React Flow integration</p>
    <h1>Flowbuilder</h1>
    <p>
      This module will host your existing <code>canvas-studio</code> experience and SDS wrappers.
    </p>

    <div class="feature-actions">
      <a [href]="canvasStudioUrl" target="_blank" rel="noreferrer" class="feature-link">
        Open canvas-studio dev app
      </a>
      <p class="feature-note">Run <code>npm run dev</code> inside <code>canvas-studio</code> to view it.</p>
    </div>
  </section>
</main>
